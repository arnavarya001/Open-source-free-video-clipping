# ====== SHORTS BOT SETTINGS ======

# --- AI (clips chunne ke liye) ---
gemini_model: gemini-3.5-flash-lite      # updated from discontinued 2.5-flash
# API key config mein mat likho; terminal mein: export GEMINI_API_KEY="..."

# --- Transcription ---
whisper_model: small                # tiny/base/small/medium (bada = better Hindi, slow)
language: auto                      # "hi" Hindi, "en" English, ya "auto"

# --- Clips ---
clips_per_video: 5
clip_min_sec: 20
clip_max_sec: 58                    # Shorts ke liye 60 se kam rakho

# --- Captions & Viral Video Styling ---
captions:
  enabled: true
  font: "Impact"                   # Viral bold font (Impact, Arial, Trebuchet MS, ya Hindi ke liye Kohinoor Devanagari)
  font_size: 84
  hook_font_size: 68
  words_per_line: 2                # 2 words per line (Raj Shamani / viral reels pacing)
  uppercase: true                  # uppercase English clips ke liye impactful hota hai
  highlight_color: "&H0000FFFF"    # Yellow active word glow/highlight (BGR format)
hook_text: true                    # top pe AI viral hook title (first 3.2 sec)
face_tracking: true                # face ke hisaab se vertical 9:16 crop (OpenCV)
video_preset: veryfast             # ffmpeg speed: ultrafast ... slow

# --- Background Music (BGM) ---
bgm:
  enabled: true                    # Automatically add mood-matched background music
  auto_mood: true                  # AI decides mood (motivational, dramatic, chill, energetic)
  default_mood: "motivational"     # Fallback mood
  volume: 0.12                     # BGM volume (0.05 - 0.25, speech clarity maintains)

# --- Upload schedule ---
schedule:
  timezone: Asia/Kolkata
  slots: ["09:00", "13:00", "19:00"]   # roz in times pe publish hoga
  max_per_day: 3                        # YouTube free quota ~6 uploads/din hai

upload:
  category_id: "22"                 # 22 = People & Blogs, 27 = Education, 24 = Entertainment
  made_for_kids: false
  default_tags: ["shorts"]

# --- Auto Cleanup ---
cleanup:
  delete_after_upload: true         # upload hote hi output clips aur downloaded video delete karein (saves GBs of disk)

# --- Auto mode (watch) ---
watch:
  channel_id: ""                    # aapke channel ka ID (UC...) -- naya video aate hi auto process
  poll_minutes: 30
  process_existing: false           # false = purane videos skip, sirf naye
  min_source_minutes: 3             # isse chhote videos (Shorts) skip
